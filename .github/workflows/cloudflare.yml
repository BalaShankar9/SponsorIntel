name: Sponsor Intel Cloudflare checks
on:
  pull_request:
    paths: ['cloudflare/**', '.github/workflows/cloudflare.yml']
  push:
    branches: ['codex/sponsorintel-cloudflare-launch', 'main', 'feat/intel-immigration-intelligence']
    paths: ['cloudflare/**', '.github/workflows/cloudflare.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: cloudflare/.nvmrc
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Use the validated npm resolver
        run: npm install --global npm@11.8.0
      - name: Verify the toolchain
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "11.8.0"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run
