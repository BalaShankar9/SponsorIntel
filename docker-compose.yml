version: "3.9"

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://sponsor_user:sponsor_pass@db:5432/sponsorintel}
  DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg2://sponsor_user:sponsor_pass@db:5432/sponsorintel}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
  # Supabase
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
  # Scraper API keys
  REED_API_KEY: ${REED_API_KEY:-}
  ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
  ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
  JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
  COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY:-}
  # Proxies
  PROXY_RESIDENTIAL_URL: ${PROXY_RESIDENTIAL_URL:-}
  PROXY_DATACENTER_URL: ${PROXY_DATACENTER_URL:-}
  # LLM
  LLM_BACKEND: ${LLM_BACKEND:-disabled}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # Notifications
  DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  # Runtime
  ENV: ${ENV:-development}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-sponsor_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sponsor_pass}
      POSTGRES_DB: sponsorintel
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sponsor_user} -d sponsorintel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./backend/data:/app/backend_data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 -Q default,agents

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3333:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
